<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SportsAI Overlay</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}#canvas{position:relative;width:1920px;height:1080px;transform-origin:0 0;background:transparent}.sponsor{position:absolute;left:0;top:0;height:auto;display:block;pointer-events:none;user-select:none;transform-origin:center;will-change:transform,opacity;opacity:0}</style></head><body><div id="canvas"><img id="a" class="sponsor"><img id="b" class="sponsor"></div><script src="/socket.io/socket.io.js"></script><script>const socket=io(),canvas=document.getElementById('canvas'),layers=[document.getElementById('a'),document.getElementById('b')];let active=0,url='';function fit(){canvas.style.transform=`scale(${innerWidth/1920},${innerHeight/1080})`}function geom(el,s){el.style.left=s.x+'px';el.style.top=s.y+'px';el.style.width=s.width+'px';el.style.transition=`opacity ${s.transitionMs||0}ms ease`;el.style.transform=`translate(-50%,-50%) perspective(${s.perspective}px) rotateX(${s.rotateX}deg) rotateY(${s.rotateY}deg) rotateZ(${s.rotateZ}deg) skewX(${s.skewX}deg) skewY(${s.skewY}deg) scale(${s.scaleX},${s.scaleY})`}function apply(s){layers.forEach(x=>geom(x,s));const next=s.currentImageUrl||'';if(!next){layers.forEach(x=>x.style.opacity=0);url='';return}if(next!==url){const old=layers[active],ni=1-active,n=layers[ni];n.style.opacity=0;n.src=next;const go=()=>requestAnimationFrame(()=>{old.style.opacity=0;n.style.opacity=s.visible?String(s.opacity):0;active=ni;url=next});n.complete?go():n.onload=go}else{layers[active].style.opacity=s.visible?String(s.opacity):0;layers[1-active].style.opacity=0}}socket.on('state',apply);addEventListener('resize',fit);fit();</script></body></html>
